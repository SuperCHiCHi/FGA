name: Append Score Preview

on:
  push:
    branches:
      - feature/append-score-support
  workflow_dispatch:

concurrency:
  group: append-score-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  FGA_VERSION_CODE: '3069'
  FGA_VERSION_NAME: '3069'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run tests
        run: ./gradlew test

      - name: Build coexistence APK
        run: ./gradlew :app:assembleDebug --parallel

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk ArtsPhonic-Card-Sequence-Append-Score-Preview-v3069.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArtsPhonic-Card-Sequence-Append-Score-Preview-v3069
          path: ArtsPhonic-Card-Sequence-Append-Score-Preview-v3069.apk
